[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "calibration", "config", "engine", "evidence", "incidents", "scenarios", "security", "sources", "stream", "tools", "utils"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
